spring.application.name=backend
server.port=8080

# Database Configuration (H2)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Kafka (bootstrap servers can be overridden by embedded Kafka)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=post-processing-group
spring.kafka.consumer.auto-offset-reset=earliest

# Retry Configuration
kafka.retry.max-attempts=3
kafka.retry.backoff-multiplier=2.0
kafka.retry.initial-interval=1000
